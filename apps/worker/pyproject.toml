[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reality-ledger-worker"
version = "0.1.0"
description = "Asynchronous ingestion worker for the AI Infrastructure Reality Ledger"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = [
  "pip-audit==2.10.1",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reality_ledger_worker"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
